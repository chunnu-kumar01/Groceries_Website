<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        /* Reset default margins and set font */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Center the login container perfectly on the screen */
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
background-color: #f2dcdc;}

/* Outer wrapper for the login area */
.logindiv {
    width: 100%;
    max-width: 400px;
    padding: 20px;
}

/* The actual login card */
.login {
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
}

/* FreshMart Branding Title */
.login h1 {
    color: #2e7d32; /* Deep green */
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 5px;
    font-weight: 700;
}

/* Welcome Subtitle */
.login h2 {
    color: #555555;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 400;
    margin-bottom: 30px;
}

/* Input labels */
.login label {
    color: #333333;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 6px;
}

/* Text and Password Fields */
.login input[type="text"],
.login input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 20px;
    border: 1px solid #cccccc;
    border-radius: 6px;
    font-size: 1rem;
    outline: none;
    transition: all 0.3s ease;
}

/* Input focus state */
.login input[type="text"]:focus,
.login input[type="password"]:focus {
    border-color: #2e7d32;
    box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
}

/* Forget Password placement */
#sts {
    text-align: right;
    margin-top: -10px;
    margin-bottom: 25px;
    font-size: 0.85rem;
}

/* Forget Password Link styling */
#sts a {
    color: #2e7d32;
    text-decoration: none;
    font-weight: 500;
}

#sts a:hover {
    text-decoration: underline;
}

/* Login Button */
.btn {
    width: 100%;
    background-color: #2e7d32;
    color: #ffffff;
    border: none;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
}

/* Button interactive states */
.btn:hover {
    background-color: #1b5e20;
}

.btn:active {
    transform: scale(0.98);
}

    </style>
</head>

<body>
    <div class="logindiv">
        <div class="login">
            <h1>FreshMart</h1>
            <h2>Welcome back!</h1>

                <label for="Username">Email:</label>
                <input type="text" placeholder="Email:">
                <label for="Password"> Password:</label>
                <input type="password" placeholder="🔓Password">
                <p id="sts"><a href="#">Forget Password?</a></p>
                
                <button class="btn" onclick="showMessage()">Login</button>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>

</html>

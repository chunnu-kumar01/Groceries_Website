<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart | Shopping Cart</title>

    <style>
        /* ========================================
   FreshMart - Premium Cart Items
======================================== */

#cart-items {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 24px 0;
}

/* Empty cart message */
#cart-items.is-empty {
    display: block;
    padding: 35px 20px;
    text-align: center;
    color: #718078;
    background: #f5faf5;
    border: 1px dashed #c9ddca;
    border-radius: 14px;
    line-height: 1.7;
}

/* Individual cart product */
.cart-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 20px;
    padding: 20px;
    background: linear-gradient(135deg, #ffffff, #f5faf5);
    border: 1px solid #e0ece0;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(31, 93, 47, 0.06);
    transition: transform 0.2s ease, box-shadow 0.2s ease,
                border-color 0.2s ease;
}

.cart-item:hover {
    transform: translateY(-2px);
    border-color: #b4d7b8;
    box-shadow: 0 8px 22px rgba(31, 93, 47, 0.11);
}

/* Product details */
.cart-item-details {
    min-width: 0;
    overflow-wrap: anywhere;
}

.cart-item-details strong {
    display: block;
    margin-bottom: 8px;
    color: #194d2b;
    font-size: 17px;
    font-weight: 750;
}

.cart-item-details p {
    margin: 5px 0;
    color: #6b7d70;
    font-size: 14px;
    line-height: 1.5;
}

.cart-item-details .cart-subtotal {
    margin-top: 9px;
    color: #21813b;
    font-weight: 750;
}

/* Quantity controls */
.quantity-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 6px;
    background: #eaf5eb;
    border: 1px solid #d5e8d6;
    border-radius: 30px;
}

.quantity-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #23823b;
    color: #ffffff;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
}

.quantity-btn:hover {
    background: #17652d;
    transform: scale(1.06);
}

.quantity-value {
    min-width: 22px;
    color: #194d2b;
    text-align: center;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
}

/* Remove product */
.remove-btn {
    padding: 10px 13px;
    border: 1px solid #f0cccc;
    border-radius: 10px;
    background: #fff5f5;
    color: #bd3434;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
}

.remove-btn:hover {
    background: #c93636;
    color: #ffffff;
    border-color: #c93636;
}

/* Clear-cart button created by cart.js */
.clear-cart-btn {
    display: block;
    margin: 0 0 22px auto;
    padding: 11px 18px;
    border: 1px solid #e9baba;
    border-radius: 10px;
    background: #fff5f5;
    color: #b52e2e;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
}

.clear-cart-btn:hover:not(:disabled) {
    background: #c93636;
    border-color: #c93636;
    color: #ffffff;
}

.clear-cart-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* Add-to-cart feedback on index.html */
.productCard .btn.added {
    background: #17652d;
    color: #ffffff;
}

/* Keyboard accessibility */
.quantity-btn:focus-visible,
.remove-btn:focus-visible,
.clear-cart-btn:focus-visible {
    outline: 3px solid #8dc99a;
    outline-offset: 3px;
}

/* Mobile layout */
@media (max-width: 600px) {
    #cart-items {
        gap: 12px;
    }

    .cart-item {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px 10px;
        padding: 15px;
    }

    .cart-item-details {
        grid-column: 1 / -1;
    }

    .quantity-controls {
        justify-self: start;
        gap: 7px;
    }

    .remove-btn {
        justify-self: end;
        padding: 10px 12px;
    }

    .quantity-btn {
        width: 32px;
        height: 32px;
    }

    .clear-cart-btn {
        margin-bottom: 18px;
    }
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
    .cart-item,
    .quantity-btn,
    .remove-btn,
    .clear-cart-btn {
        transition: none;
    }

    .cart-item:hover,
    .quantity-btn:hover {
        transform: none;
    }
}

    </style>
</head>

<body>
    <section id="cart">
        <h2>🛒 My Shopping Cart</h2>

        <p>Items: <span id="cart-count">0</span></p>

        <div id="cart-items">Your cart is empty.</div>

        <h3>
            <span>Total:</span>
            <span>₹<span id="cart-total">0</span></span>
        </h3>

        <a href="index.html#products" class="continue-shopping">
            ← Continue Shopping
        </a>
    </section>

    <script src="cart.js" defer></script>
</body>

</html>
